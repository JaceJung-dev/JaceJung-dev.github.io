<!--
Code for integrating CloudFlare's email protection with Hydejack's single page app loading.
-->
<script>
  document
    .getElementById("_pushState")
    .addEventListener("hy-push-state-after", function (e) {
      function e(e) {
        (console.error ? console.error : console.log).call(console, e);
      }

      function t(e) {
        return (
          (l.innerHTML = '<a href="' + e.replace(/"/g, "&quot;") + '"></a>'),
          l.childNodes[0].getAttribute("href")
        );
      }

      function r(e, t) {
        var r = e.substr(t, 2);
        return parseInt(r, 16);
      }

      function n(e, n) {
        for (var o = "", c = r(e, n), a = n + 2; a < e.length; a += 2) {
          var l = r(e, a) ^ c;
          o += String.fromCharCode(l);
        }
        return t(o);
      }

      var o = "/cdn-cgi/l/email-protection#",
        c = ".__cf_email__",
        a = "data-cfemail",
        l = document.createElement("div");

      (!(function () {
        for (
          var t = document.getElementsByTagName("a"), r = 0;
          r < t.length;
          r++
        )
          try {
            var c = t[r],
              a = c.href.indexOf(o);
            a > -1 && (c.href = "mailto:" + n(c.href, a + o.length));
          } catch (t) {
            e(t);
          }
      })(),
        (function () {
          for (var t = document.querySelectorAll(c), r = 0; r < t.length; r++)
            try {
              var o = t[r],
                l = n(o.getAttribute(a), 0),
                i = document.createTextNode(l);
              o.parentNode.replaceChild(i, o);
            } catch (t) {
              e(t);
            }
        })());
    });
</script>

<!--
Example code for using Matamo as alternative analytics solution.
-->
{% if site.matomo_analytics %}
<script>
  var _paq = _paq || [];

  /*{% if site.matomo_analytics.no_cookies %}*/
  _paq.push(["disableCookies"]);
  /*{% endif %}*/

  _paq.push(["trackPageView"]);
  _paq.push(["enableLinkTracking"]);
  _paq.push(["setTrackerUrl", u + "piwik.php"]);
  _paq.push(["setSiteId", "{{site.matomo_analytics.site_id}}"]);

  var pushStateEl = document.getElementById("_pushState");
  var timeStartLoadPage, referer, timeItTookToLoadPage;

  pushStateEl.addEventListener("hy-push-state-start", function () {
    timeStartLoadPage = new Date().getTime();
    referer = window.location.toString();
  });

  pushStateEl.addEventListener("hy-push-state-ready", function () {
    timeItTookToLoadPage = new Date().getTime() - timeStartLoadPage;
  });

  pushStateEl.addEventListener("hy-push-state-after", function () {
    _paq.push(["setReferrerUrl", referer]);
    _paq.push(["setCustomUrl", window.location.toString()]);
    _paq.push(["setDocumentTitle", document.title]);
    _paq.push(["deleteCustomVariables", "page"]);
    _paq.push(["setGenerationTimeMs", timeItTookToLoadPage]);
    _paq.push(["trackPageView"]);
  });

  window.loadJSDeferred("{{site.matomo_analytics.root}}piwik.js");
</script>
{% endif %} {% endcomment %}

<script>
  function initTocScrollSpy() {
    var tocLinks = document.querySelectorAll(".toc-nav a");
    if (!tocLinks.length) return;

    var headings = [];
    tocLinks.forEach(function (link) {
      var id = link.getAttribute("href").slice(1);
      var el = document.getElementById(id);
      if (el) headings.push({ id: id, el: el, link: link });
    });

    if (!headings.length) return;

    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            tocLinks.forEach(function (l) {
              l.classList.remove("toc-active");
            });
            var match = headings.find(function (h) {
              return h.id === entry.target.id;
            });
            if (match) match.link.classList.add("toc-active");
          }
        });
      },
      { rootMargin: "0px 0px -75% 0px", threshold: 0 },
    );

    headings.forEach(function (h) {
      observer.observe(h.el);
    });
  }

  // 초기 로드
  document.addEventListener("DOMContentLoaded", initTocScrollSpy);

  // Hydejack SPA 페이지 전환 시 재실행
  var pushStateEl = document.getElementById("_pushState");
  if (pushStateEl) {
    pushStateEl.addEventListener("hy-push-state-after", initTocScrollSpy);
  }
</script>
